[project]
name = "vincent-cli"
version = "4.0.0"
description = "Vincent — orquestrador neural de IA (OmniRoute/Ollama) e laboratório de hardware ESP32"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
hardware = ["pyserial>=3.5"]
api = ["flask>=3.0", "flask-socketio>=5.3"]

[project.scripts]
vincent = "vincent.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
