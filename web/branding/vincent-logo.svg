<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="VincentOS">
  <defs>
    <linearGradient id="vSwirl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="vNight" cx="0.42" cy="0.36" r="0.85">
      <stop offset="0" stop-color="#1c1c30"/>
      <stop offset="0.55" stop-color="#0e0e1a"/>
